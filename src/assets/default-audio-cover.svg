<!--
  File: default-audio-cover.svg | Author: Chace Nielson
  Date Created: Oct 30, 2026
  Date Updated: Oct 30, 2026
  Description: Shared fallback artwork for audio without its own cover image.
  Usage: Used by the shared media player and queue when a track has no coverArt.
  Notes: Decorative artwork; surrounding controls provide track context.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#173f38" />
      <stop offset="1" stop-color="#315f50" />
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="32" fill="url(#background)" />
  <circle cx="160" cy="160" r="104" fill="#ffffff" opacity=".06" />
  <path
    d="M75 175h20l15-40 24 83 21-111 24 124 22-76 17 20h27"
    fill="none"
    stroke="#f1d59a"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="9"
  />
  <path d="M72 226h176" fill="none" stroke="#ffffff" opacity=".3" stroke-width="2" />
</svg>
